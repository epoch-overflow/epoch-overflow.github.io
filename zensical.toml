# Zensical 設定ファイル
# 参考: https://zensical.org/docs/setup/basics/

[project]
site_name = "Epoch Overflow"
site_description = "2038年問題をはじめとする、時刻表現の桁あふれ問題についての日本語情報サイト"
site_url = "https://epoch-overflow.github.io/"
repo_url = "https://github.com/epoch-overflow/epoch-overflow.github.io"
repo_name = "epoch-overflow"
copyright = "本文は <a href=\"https://creativecommons.org/licenses/by/4.0/deed.ja\">CC BY 4.0</a>、コードは BSD-2-Clause で提供しています。"

nav = [
  { "ホーム" = "index.md" },
  { "2038年問題" = [
    "y2038/index.md",
    { "仕組み" = "y2038/mechanism.md" },
    { "影響を受けるもの" = "y2038/impact.md" },
    { "対策" = "y2038/countermeasures.md" },
    { "よくある質問" = "y2038/faq.md" },
  ] },
  { "時刻の桁あふれ問題" = [
    "overflow/index.md",
    { "GPS週番号ロールオーバー" = "overflow/gps-rollover.md" },
  ] },
  { "参考資料" = "references.md" },
  { "このサイトについて" = "about.md" },
]

[project.theme]
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
# サイト言語。検索の言語（日本語の分かち書き）もこの設定から決まる。
language = "ja"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "ライトモードに切り替え"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "ダークモードに切り替え"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "システム設定に従う"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
